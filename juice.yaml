# This YAML is provided as a secure example because the original input was a Trivy JSON report, not a Kubernetes YAML.
# No vulnerabilities were found in the provided Trivy report.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        resources: # FIXED: Added resource limits
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        securityContext: # FIXED: Applied security best practices
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000 # Example non-root user ID
          capabilities:
            drop:
              - ALL